# zlib 1.2 and vtk_base 9.2.6 were pinned when this feedstock was last
# rendered (conda-forge-pinning 2024.10). They are dropped rather than
# bumped: an occt built today needs libzlib 1.3, and holding 1.2 dragged
# the whole solve back to a 2024 python build to satisfy it. vtk is not
# used at all now that occt is the novtk variant.
libboost_devel:
- 1.84

# Our OCCT fork is 8.0.1 and the ABI audit found it compatible with upstream
# V8_0_1 for everything ifcopenshell touches, so the stock build links against
# conda-forge occt 8.0.1 and runs against the fork. Pinned here because the
# conda-forge global pinning decides occt otherwise.
occt:
- 8.0.1

channel_sources:
- realthunder, freecad, conda-forge, defaults

channel_targets:
- realthunder main
